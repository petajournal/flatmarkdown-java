name: Release to Maven Central

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  native:
    name: Build native (${{ matrix.resource_dir }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Resource dir and file name must match FlatmarkdownJava.loadNativeLibrary().
          - os: macos-latest
            resource_dir: darwin-aarch64
            lib_file: libflatmarkdown_java.dylib
            build: cargo build --release
            out_dir: target/release
          - os: windows-latest
            resource_dir: win32-x86-64
            lib_file: flatmarkdown_java.dll
            build: cargo build --release
            out_dir: target/release
          # A plain cargo build links against the runner's glibc, so the .so would
          # not load on older distributions. zigbuild pins glibc 2.17, the oldest
          # version Rust's std supports.
          - os: ubuntu-latest
            resource_dir: linux-x86-64
            lib_file: libflatmarkdown_java.so
            build: cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.17
            out_dir: target/x86_64-unknown-linux-gnu/release
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        run: pip install cargo-zigbuild

      - name: Build Rust cdylib
        run: ${{ matrix.build }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.resource_dir }}
          path: ${{ matrix.out_dir }}/${{ matrix.lib_file }}
          if-no-files-found: error

  deploy:
    name: Sign and deploy
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Each artifact lands in src/main/resources/<resource_dir>/<lib_file>,
      # the same layout build.sh produces locally.
      - uses: actions/download-artifact@v8
        with:
          path: src/main/resources

      - name: List bundled native libraries
        run: find src/main/resources -type f

      # setup-java imports the GPG key and writes ~/.m2/settings.xml with the
      # "central" server. The server id must match publishingServerId in pom.xml.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # Use the wrapper, not the runner's Maven. The runner ships Maven 4, which
      # refuses to send the "central" server credentials to central.sonatype.com.
      - name: Deploy
        run: ./mvnw -B -Prelease deploy
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
